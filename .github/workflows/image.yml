name: build image

# One job, no artifacts.
#
# Actions artifact storage on a private repo is 500 MB and a single image is
# ~2 GB, so every build failed on quota — and deleting old artifacts does not
# help, because usage is only recalculated every 6-12 hours. Release assets are
# billed separately and do not touch that quota.
#
# Merging the menu and image builds into one job also removes the only reason
# artifacts were needed at all: handing the Godot export between jobs.

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - 'daemon/**'
      - 'menu/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only for contents, so creating a release
# comes back 403 "Resource not accessible by integration".
permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    name: build console image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # --- Menu -------------------------------------------------------------
      - name: Fetch Godot + export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fLO "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fLO "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$tdir/"

      - name: Export the menu
        run: |
          set -euo pipefail
          godot --headless --path menu --import || true
          mkdir -p build
          godot --headless --path menu \
                --export-release "Linux x86_64" "$GITHUB_WORKSPACE/build/penta-menu"
          chmod +x build/penta-menu
          file build/penta-menu

      # --- Image ------------------------------------------------------------
      - name: Stage payload into the image tree
        run: |
          set -euo pipefail
          root=image/mkosi/mkosi.extra
          install -D -m 0755 build/penta-menu "$root/opt/penta/penta-menu"
          mkdir -p "$root/opt/penta/daemon"
          cp -r daemon/pentad "$root/opt/penta/daemon/"
          install -D -m 0644 docs/DESIGN.md "$root/usr/share/penta/DESIGN.md"
          find "$root/opt/penta" -maxdepth 2

      - name: Free up disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Build
        # mkosi runs inside an Arch container: pacman is native there, so no
        # tools tree has to be bootstrapped. --privileged for loop devices,
        # seccomp=unconfined because pacman's fc-cache-32 hook hits blocked
        # syscalls under Docker's default profile.
        run: |
          mkdir -p out
          docker run --rm --privileged \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/work" \
            -v /dev:/dev \
            -w /work/image/mkosi \
            archlinux:latest bash -euxo pipefail -c '
              pacman -Sy --noconfirm --needed \
                mkosi systemd-ukify btrfs-progs dosfstools e2fsprogs \
                zstd xz cpio mtools arch-install-scripts squashfs-tools \
                erofs-utils git python gnupg
              mkosi --version
              mkosi --output-dir /work/out --debug build

              # A dd-ed disk has no NVRAM boot entry, so firmware only probes
              # the removable-media path. Without this it drops to a UEFI shell.
              loop=$(losetup -fP --show /work/out/penta.raw)
              mkdir -p /mnt/esp /mnt/root
              mount "${loop}p1" /mnt/esp
              find /mnt/esp -maxdepth 3 | sed "s|/mnt/esp|ESP|"
              df -h /mnt/esp

              if [ ! -f /mnt/esp/EFI/BOOT/BOOTX64.EFI ]; then
                mkdir -p /mnt/esp/EFI/BOOT
                src=$(find /mnt/esp/EFI -iname "systemd-boot*.efi" | head -1)
                if [ -n "$src" ]; then
                  cp "$src" /mnt/esp/EFI/BOOT/BOOTX64.EFI
                else
                  src=$(find /mnt/esp/EFI/Linux -iname "*.efi" | head -1)
                  test -n "$src" || { echo "nothing bootable on the ESP"; exit 1; }
                  mv "$src" /mnt/esp/EFI/BOOT/BOOTX64.EFI
                fi
              fi
              test -f /mnt/esp/EFI/BOOT/BOOTX64.EFI
              umount /mnt/esp

              # A missing CopyFiles= produces a valid, empty root whose only
              # symptom is switch-root failing 20 minutes later in QEMU. Fail
              # here instead, where the message names the cause.
              mount "${loop}p2" /mnt/root
              echo "--- root filesystem ---"
              du -sh /mnt/root 2>/dev/null | tail -1
              for f in /usr/lib/systemd/systemd /usr/bin/gamescope /opt/penta/penta-menu; do
                test -e "/mnt/root$f" || { echo "MISSING from root: $f"; exit 1; }
                echo "  ok  $f"
              done
              umount /mnt/root

              sync
              losetup -d "$loop"
            '
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out/

      - name: Compress for flashing
        # xz because Etcher, Rufus and balena read it; zstd they do not.
        run: |
          set -euo pipefail
          test -f out/penta.raw || { ls -R out; exit 1; }
          TAG="build-${GITHUB_RUN_NUMBER}"
          IMG="penta-${GITHUB_SHA::7}.img.xz"
          xz -3 -T0 -c out/penta.raw > "out/$IMG"
          rm -f out/penta.raw
          ls -lh "out/$IMG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          size=$(stat -c%s "out/$IMG")
          # GitHub rejects release assets over 2 GiB.
          test "$size" -lt 2147483648 \
            || { echo "asset too large for a release: $size bytes"; exit 1; }

      - name: Check the partition table
        run: |
          set +o pipefail
          xz -dc "out/$IMG" 2>/dev/null | dd of=/tmp/head.img bs=1M count=8 \
             iflag=fullblock status=none || true
          set -o pipefail
          python3 - <<'PYEOF'
          import struct, uuid, sys
          ESP = uuid.UUID("c12a7328-f81f-11d2-ba4b-00a0c93ec93b")
          data = open("/tmp/head.img", "rb").read()
          assert data[512:520] == b"EFI PART", "no GPT header at LBA1"
          first, count, size = struct.unpack_from("<QII", data, 512 + 72)
          found = []
          for i in range(count):
              off = first * 512 + i * size
              raw = data[off:off + 56]
              if len(raw) < 56:
                  break
              t = uuid.UUID(bytes_le=raw[0:16])
              if int(t) == 0:
                  continue
              name = data[off + 56:off + 128].decode("utf-16-le").rstrip("\x00")
              s, e = struct.unpack_from("<QQ", raw, 32)
              print(f"  {i+1}: {name or '(unnamed)'}  {(e-s+1)*512//1024**3} GiB")
              found.append(t)
          if ESP not in found:
              sys.exit("FAIL: no EFI System Partition")
          print("partition table OK")
          PYEOF

      # --- Publish ----------------------------------------------------------
      - name: Publish the image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PENTA ${{ env.TAG }}
          files: out/${{ env.IMG }}
          body: |
            PENTA console image from `${{ github.sha }}`.

            Flash with Etcher, or:
            ```
            sudo ./tools/flash-usb.sh <image.img.xz> diskN
            ```

            Boot the USB, then Settings → Install to disk for an internal drive.

      - name: Boot it in QEMU and photograph the screen
        continue-on-error: true
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf netcat-openbsd imagemagick
          xz -dc "out/$IMG" > /tmp/penta.raw
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/vars.fd
          mkdir -p /tmp/shots out/frames

          qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu qemu64 -m 4096 -smp 4 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=/tmp/vars.fd \
            -drive file=/tmp/penta.raw,format=raw,if=virtio \
            -device virtio-vga -display none \
            -serial file:/tmp/boot.log \
            -monitor telnet:127.0.0.1:5555,server,nowait \
            -no-reboot &
          QPID=$!

          sleep 8
          for i in $(seq 1 26); do
            kill -0 "$QPID" 2>/dev/null || break
            printf 'screendump /tmp/shots/f%02d.ppm\n' "$i" \
              | timeout 10 nc 127.0.0.1 5555 >/dev/null 2>&1 || true
            grep -aq "PENTA-BOOT-OK" /tmp/boot.log 2>/dev/null && break
            sleep 20
          done
          kill "$QPID" 2>/dev/null || true
          sleep 2

          # Attach the last few frames to the release: a failed boot has to be
          # visible somewhere, and artifacts are not available to us.
          for f in $(ls -t /tmp/shots/*.ppm 2>/dev/null | head -4); do
            convert "$f" "out/frames/boot-$(basename "${f%.ppm}").png" 2>/dev/null || true
          done
          ls -lh out/frames/ 2>/dev/null || true

          echo "======== serial ========"
          tail -c 4000 /tmp/boot.log | tr -d '\000' || true
          echo "========================"
          if grep -aq "PENTA-BOOT-OK" /tmp/boot.log; then
            echo "BOOT VERIFIED: $(grep -ao 'PENTA-BOOT-OK.*' /tmp/boot.log | head -1)"
          else
            echo "did not reach penta.target in the window"
            grep -aq "3008;start=" /tmp/boot.log && echo "  (systemd started)"
          fi

      - name: Attach boot frames
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: out/frames/*.png
