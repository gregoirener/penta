# PENTA installer image.
#
# A separate, deliberately tiny bootable image whose only job is to write PENTA
# onto an internal disk. It is NOT PENTA — there is no Steam, no Nvidia stack,
# no compositor and no menu in here.
#
# WHY THIS EXISTS
#
# Installing used to mean booting PENTA itself off a USB stick and cloning that
# stick onto the NVMe. That made the stick hold the entire operating system:
# 14 GiB, so a 32 GB stick minimum, and the clone could never be written to a
# disk smaller than the stick it came from. But nobody wants to *run* PENTA
# from a USB stick — the stick is a courier. This image is the courier and
# nothing else.
#
# THE PAYLOAD IS NOT IN THIS IMAGE
#
# penta-<sha>.img.xz is ~2 GB and GitHub rejects release assets over 2 GiB, so
# embedding it would make the installer unpublishable. Instead this image
# carries an empty, clearly-labelled FAT32 partition (PENTA_IMG) that you
# drop the image file onto after flashing — it mounts on macOS and Windows like
# any other USB stick. Empty space costs nothing: a 6 GiB partition of zeros
# compresses to a few hundred KB, so the installer asset stays ~400 MB.
#
#   1. flash penta-installer.img.xz to any stick, 8 GB or larger
#   2. copy penta-<sha>.img.xz onto the PENTA_IMG volume that appears
#   3. boot it, pick the disk, confirm
#
# See image/mkosi/ for the console image this installs.

[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=disk
ImageId=penta-installer
Output=penta-installer

[Content]
Bootable=yes

# Nothing here is ever prompted for. systemd-firstboot blocks the boot waiting
# on a keyboard if any of these are unset, and an installer that hangs before
# it draws anything is indistinguishable from one that does not boot.
Hostname=penta-installer
Locale=en_US.UTF-8
LocaleMessages=en_US.UTF-8
# QWERTZ hardware — a US keymap makes every recovery shell mistype, which is
# exactly when you least want to be fighting the keyboard. Use ch for a Swiss
# board instead of de.
Keymap=de
Timezone=UTC
RootPassword=penta
Bootloader=systemd-boot

# Same two-console arrangement as the console image, for the same reason: the
# panel is /dev/console (being last) and the serial port still receives
# everything, which is the only channel CI can read.
KernelCommandLine=
        console=ttyS0,115200
        console=tty0
        systemd.show_status=1

Packages=
        base
        linux
        systemd
        systemd-sysvcompat

        # Writing the image
        xz
        zstd
        coreutils
        util-linux

        # Repairing the target's partition table and registering it with the
        # firmware. The console image shipped without these once and installs
        # failed halfway through, having already erased the disk.
        gptfdisk
        efibootmgr
        dosfstools
        e2fsprogs
        btrfs-progs

        # Diagnostics, for when a disk is not where the installer expects
        pciutils
        usbutils

# Deliberately NO linux-firmware. The installer needs to read a USB stick and
# write an NVMe; neither wants firmware, and the package is well over a GiB —
# a third of the finished image for nothing. The console image keeps it,
# because Wi-Fi does need it.

# The initrd has to be able to reach the stick this is booting from and the
# disk it is writing to. Getting this wrong means a kernel that boots and then
# cannot find its own root.
# Whole storage subsystems — see the long note in image/mkosi/mkosi.conf.
#
# In mkosi this option is a ceiling, not a floor: the initrd gets only what
# matches. The console image's list named individual drivers, omitted `vmd`,
# and died in emergency mode on a machine whose NVMe sits behind Intel RST.
#
# This image got away with it because it boots off USB and usb_storage was on
# the list — and once running it had every module, which is how it could write
# an NVMe its own initrd could never have found. Luck, not design.
#
# There is no release-size pressure here (this image is ~400 MB against a 2 GiB
# limit), but it matches the console image so the two cannot drift into
# disagreeing about which hardware can be booted.
KernelModulesInitrdInclude=
        drivers/nvme/
        drivers/pci/
        drivers/ata/
        drivers/scsi/
        drivers/usb/
        drivers/block/
        drivers/virtio/
        drivers/md/
        drivers/mmc/
        fs/
        crypto/
        lib/

[Validation]
SourceDateEpoch=0
