[Manager]
# LogTarget=kmsg, not =console: kmsg goes through printk and printk reaches
# *every* registered console, so the serial port sees it too. Logging to
# "console" writes only to /dev/console — which is the panel — and left CI's
# serial capture empty on every run of the console image's build.
#
# ShowStatus=no here, unlike the console image: this machine's screen belongs
# to the installer, and unit status lines scrolling over a "this will erase
# your disk" prompt is not a trade worth making. The serial log still has
# everything.
ShowStatus=no
LogTarget=kmsg
LogLevel=info

# Finite, not infinite. An installer that hangs forever with nothing on screen
# is the worst possible failure for this image in particular.
DefaultTimeoutStartSec=120s
DefaultTimeoutStopSec=30s
DefaultDeviceTimeoutSec=30s
