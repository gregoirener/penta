# EFI System Partition.
#
# 512 MiB rather than the console image's 2 GiB: this initrd carries no
# firmware and no Nvidia modules, so the UKI is a fraction of the size. Still
# roomy enough for the kernel plus the copy at the removable-media path, which
# is the one firmware will actually boot from a freshly written stick.
[Partition]
Type=esp
Format=vfat
Label=PENTA_IESP
CopyFiles=/boot:/
SizeMinBytes=512M
SizeMaxBytes=512M
