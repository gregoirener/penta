# Where you put penta-<sha>.img.xz after flashing.
#
# Empty on purpose, and FAT32 on purpose: this is the partition that appears in
# Finder and in Explorer when the stick is plugged in, so getting the payload
# onto it is drag-and-drop rather than a dd incantation.
#
# 6 GiB of zeros costs a few hundred KB in the compressed artifact, so this
# partition is close to free — and it leaves room for a future image well
# larger than today's 2 GB one.
#
# Last in filename order so it is the partition at the end of the device, which
# is what lets `penta-install` grow it to fill a bigger stick if it ever needs
# to.
[Partition]
Type=linux-generic
Format=vfat
Label=PENTA_PAYLOAD
SizeMinBytes=6G
SizeMaxBytes=6G
