# The installer OS. Read-only in practice; nothing here is meant to persist.
#
# 2 GiB against ~900 MB used. There is no firmware, no graphics stack and no
# menu in this image — that is the entire reason it is small enough to be worth
# having as a separate thing.
[Partition]
Type=root-x86-64
# btrfs, not erofs. erofs is read-only and would compress this to a fraction of
# the size, but systemd wants a writable /etc and /var — machine-id,
# tmpfiles.d, the journal — and making that work needs an overlay
# (systemd.volatile=overlay) that cannot be verified anywhere but on the target.
# The compressed difference is small because most of this partition is empty
# space that xz eats anyway. Not worth an untestable boot failure.
Format=btrfs
Label=PENTA_INST
# Without CopyFiles= repart produces a perfectly valid empty filesystem and the
# initrd then fails switch-root into a root with no system in it. The console
# image learned this the expensive way; carrying our own root definition means
# carrying this line too.
CopyFiles=/
# 3 GiB against ~1.1 GB used. Empty space costs almost nothing compressed, and
# a root that is too small fails the build in a way that is tedious to diagnose.
SizeMinBytes=3G
SizeMaxBytes=3G
