# EFI System Partition.
#
# 2 GiB, not 1: mkosi builds a Unified Kernel Image with the kernel, initrd and
# firmware all in one PE binary, which runs several hundred MB. 1 GiB left no
# room to also place it at the removable-media path.
[Partition]
Type=esp
Format=vfat
Label=PENTA_ESP
CopyFiles=/boot:/
SizeMinBytes=2G
SizeMaxBytes=2G
