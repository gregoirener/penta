# Root. Fixed at build time; it never needs to grow because games live on the
# data partition, which systemd-repart expands to fill the disk on first boot.
#
# 12G against ~7G actually used. Every extra GB here is zeros that still have to
# be decompressed and written on install, and still has to fit on disk when
# someone wants to run the image in a VM.
[Partition]
Type=root-x86-64
Format=btrfs
Label=PENTA_SYS
# Without this, repart formats a perfect, empty filesystem and the whole OS is
# silently left behind — the initrd then mounts a valid root with no system in
# it and switch-root fails into emergency mode. mkosi's own root definition
# carries this; overriding the definition means carrying it ourselves.
CopyFiles=/
SizeMinBytes=12G
SizeMaxBytes=12G
