[Manager]
# Long timeouts, not infinite ones.
#
# These used to be `infinity`, on the reasoning that a console has no operator
# to rescue a unit that gives up at 90 seconds. The failure mode that produced
# is worse than the one it prevented: any unit that wedges — a mount waiting on
# a partition that does not exist yet, a device that never appears — holds the
# boot forever, silently, with no failure to report and nothing on screen.
#
# Finite and generous means a slow step is still a slow boot, but a wedged step
# becomes a *failed unit* and everything that does not depend on it carries on.
# A console that boots with no swap is a console. A console that hangs is not.
DefaultTimeoutStartSec=180s
DefaultTimeoutStopSec=30s

# Devices in particular: /games and swap live on partitions systemd-repart only
# creates on first boot, so on the very first start they are legitimately
# absent. 30s, then the mount fails and is retried by penta-mount-data.service.
DefaultDeviceTimeoutSec=30s
