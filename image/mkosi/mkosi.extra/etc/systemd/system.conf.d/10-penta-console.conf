# Print per-unit progress to /dev/console.
#
# The kernel cmdline ends with `console=ttyS0`, and the last console= wins for
# /dev/console — so this goes to the serial port, and the laptop panel stays
# silent behind Plymouth. It is what turns "black screen, no idea" into "stuck
# on foo.service" both in CI and with a serial cable.
[Manager]
ShowStatus=yes
LogTarget=console
LogLevel=info
