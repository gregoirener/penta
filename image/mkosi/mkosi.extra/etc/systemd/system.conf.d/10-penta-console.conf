# Make the boot say what it is doing, on every console at once.
#
# The kernel command line lists two consoles (see mkosi.conf):
#
#   console=ttyS0,115200   serial — the only thing CI and QEMU can read
#   console=tty0           the laptop panel — and, being last, /dev/console
#
# LogTarget=kmsg rather than =console is the whole trick: kmsg goes through
# printk, and printk goes to *every* registered console. Logging to "console"
# would write to /dev/console only, which is the panel — so CI's serial capture
# stayed empty and every build reported "did not reach penta.target" whether it
# had or not.
[Manager]
ShowStatus=yes
LogTarget=kmsg
LogLevel=info
