[Unit]
# `console=ttyS0` on the kernel command line makes systemd-getty-generator pull
# in a serial getty automatically. On this laptop there is no serial port, so
# agetty fails to open it, systemd respawns it, and it fails again — the
# respawn loop that made the first boots unreadable.
#
# The console *output* on ttyS0 is worth keeping (it is how CI sees anything at
# all); the login prompt on it is not. So: output always, getty only if asked.
#
#   touch /etc/penta-serial-login   # then reboot, on a machine that has one
ConditionPathExists=/etc/penta-serial-login
