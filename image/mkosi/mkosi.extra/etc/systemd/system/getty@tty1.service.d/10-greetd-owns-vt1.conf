[Unit]
# greetd runs the session on VT1. Without this the getty wins the race and you
# get "archlinux login:" instead of the console — which is exactly what the
# first boot on real hardware did.
#
# A condition rather than a mask: masking to /dev/null breaks the
# `systemctl preset-all` mkosi runs while building the image.
ConditionPathExists=/etc/penta-getty-tty1-enabled
