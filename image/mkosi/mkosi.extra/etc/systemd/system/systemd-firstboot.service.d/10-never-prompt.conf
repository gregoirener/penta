[Unit]
# Everything it would ask for is baked into the image (see mkosi.conf), so it
# has nothing to do. This makes certain it can never block the boot on keyboard
# input that nobody is there to provide.
ConditionPathExists=/etc/penta-run-firstboot

[Service]
# If it ever does run, it must not sit waiting for a human.
ExecStart=
ExecStart=/usr/bin/systemd-firstboot --locale=en_US.UTF-8 --timezone=UTC --hostname=penta
TimeoutStartSec=30
