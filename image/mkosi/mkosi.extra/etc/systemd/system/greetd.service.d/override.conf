[Unit]
# greetd owns VT1; the getty on it is condition'd off so nothing races for the
# screen.
After=pentad.service getty@tty1.service
Wants=pentad.service
Conflicts=getty@tty1.service

# Never give up. The default rate limit (5 starts in 10s) turns a session that
# fails fast — a missing menu binary, a compositor that cannot get DRM master —
# into a permanently dead unit and a black screen with no way back. On a
# console there is nobody to run `systemctl reset-failed`, so we keep trying
# and let penta-beacon/VT2 say what is wrong.
StartLimitIntervalSec=0

[Service]
# gamescope on Nvidia can take a while to come up on first boot while the
# driver initialises. Ten minutes is far past any legitimate start, but still
# ends in an error rather than hanging forever with a blank screen.
TimeoutStartSec=600
Restart=always
# 5s, not 2s: a tight respawn loop against a failing compositor produces
# hundreds of log lines a minute and makes the actual first error impossible
# to find.
RestartSec=5

[Install]
WantedBy=penta.target
