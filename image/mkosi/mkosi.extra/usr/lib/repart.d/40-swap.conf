# Hibernation target for Rest Mode.
#
# Ordered BEFORE the data partition (40- vs 50-), and that ordering is the
# whole point. systemd-repart appends partitions in filename order and never
# moves one. With swap last, the data partition was walled in and could never
# be grown again — so cloning a 32 GB stick onto a 1 TB NVMe left ~940 GB
# unallocated and the console reported a tiny library on a huge drive.
# Data last means data grows, on this disk and on every disk it is cloned to.
[Partition]
Type=swap
Label=PENTA_SWAP
Format=swap
# A range, not a fixed 20G. SizeMinBytes is a hard requirement: if repart
# cannot satisfy it, it creates *nothing at all* and exits non-zero — so a
# fixed 20G swap plus a 32G data minimum meant any disk under ~66 GiB got no
# data partition, no swap, and no explanation. That includes most USB sticks,
# which is precisely where this image gets tried first.
SizeMinBytes=512M
SizeMaxBytes=20G
# Enough weight to reach the 20G cap on any real drive, small enough that on a
# stick it takes a slice rather than the whole thing.
Weight=500
