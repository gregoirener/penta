# Created on FIRST BOOT by systemd-repart, not shipped in the image.
#
# The flashed image is ~25 GiB on a 1 TB disk. systemd-repart notices the
# unallocated space, creates this partition to fill it, and fixes the GPT
# backup header that dd left in the wrong place. No custom firstboot script.
[Partition]
Type=linux-generic
Label=PENTA_DATA
Format=btrfs
# zstd:1 typically saves 10-20% on game assets for negligible CPU, and over a
# USB link it raises effective read throughput because there's less to move.
MakeDirectories=/games /captures /art
Subvolumes=/games /captures /art
SizeMinBytes=32G
Weight=1000
GrowFileSystem=yes
