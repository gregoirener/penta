# Created on FIRST BOOT by systemd-repart, not shipped in the image.
#
# The flashed image is ~14 GiB whatever it is written to. systemd-repart
# notices the unallocated space, creates this partition to fill it, and fixes
# the GPT backup header that dd left in the wrong place. No custom firstboot
# script.
#
# Last in filename order on purpose — see 40-swap.conf. Being the final
# partition is what lets it grow into free space on a later boot, which is how
# a clone of a small stick fills a large disk.
[Partition]
Type=linux-generic
Label=PENTA_DATA
Format=btrfs
# Subvolumes, not MakeDirectories: fstab mounts these with `subvol=`, and that
# only works on a real subvolume. Listing both meant repart could leave plain
# directories behind and every mount then failed with EINVAL — which reads as
# "the disk is broken" and is not. penta-mount-data.service creates any that
# are missing, so an older systemd-repart cannot silently break the mounts.
Subvolumes=/games /captures /art
# 2G, not 32G. A minimum repart cannot meet aborts the entire run — see the
# note in 40-swap.conf. Weight is what actually sizes this; the minimum only
# says "below this, don't bother".
SizeMinBytes=2G
Weight=10000
GrowFileSystem=yes
