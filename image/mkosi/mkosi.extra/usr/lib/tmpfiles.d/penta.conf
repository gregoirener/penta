# Directories the console needs before anything mounts over them.
d /opt/penta                  0755 root  root  -
d /home/penta                 0700 penta penta -
d /home/penta/.local          0755 penta penta -
d /home/penta/.local/share    0755 penta penta -
d /home/penta/.config         0755 penta penta -
d /home/penta/.cache          0755 penta penta -
d /games                      0755 penta penta -
d /games/native               0755 penta penta -
d /games/roms                 0755 penta penta -
d /var/lib/penta              0755 penta penta -
d /var/lib/penta/art          0755 penta penta -
d /var/lib/penta/captures     0755 penta penta -
d /var/log/penta              0755 penta penta -

# pentad only creates its privileged control socket if this exists, so without
# it `pentactl` has nothing to talk to and the daemon says nothing about why.
d /run/penta                  0755 root  root  -

# Where devsync.sh's key goes. Nothing here creates one — drop a public key at
# /root/.ssh/authorized_keys via image/mkosi/mkosi.extra/ and rebuild, or the
# dev loop cannot connect (sshd is deliberately key-only, see
# /etc/ssh/sshd_config.d/10-penta.conf).
d /root/.ssh                  0700 root  root  -
