# The console's service account, created declaratively by systemd-sysusers at
# first boot rather than by a script at image-build time — mkosi runs build
# scripts on the host, not inside the image, so `useradd` there creates a user
# in the wrong place entirely.
#
# No password and no shell: greetd starts this account, nothing else can.

# A real shell, not /usr/bin/false: greetd opens a PAM session for this account
# and nologin shells are what PAM stacks reject. Nothing can log in anyway —
# there is no prompt and no password.
g input -
g video -
g audio -
g render -

u penta - "PENTA console" /home/penta /bin/bash

m penta input
m penta video
m penta audio
m penta render
