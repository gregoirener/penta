# Grow the disk on first boot.
#
# systemd ships systemd-repart.service enabled via a vendor symlink, and the
# build's `systemctl preset-all` pass against Arch's `disable *` removes it
# along with everything else. Without repart there is no data partition and no
# swap, so /games never exists and the fstab entries wait on labels that will
# never appear — which is where the swap timeouts came from.
#
# A drop-in under /usr/lib has no symlink to remove and no preset that applies.
# See multi-user.target.d/10-penta.conf for the same reasoning at length.
[Unit]
Wants=systemd-repart.service
