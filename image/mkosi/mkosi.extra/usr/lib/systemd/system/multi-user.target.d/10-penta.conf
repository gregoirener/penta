# Pull in the distribution services the console cannot work without.
#
# This is a drop-in under /usr/lib, and that is the entire point. Enablement in
# this image was `.wants/` symlinks under /etc, which is precisely what
# `systemctl disable` — and therefore `systemctl preset-all`, which the build
# runs against Arch's `disable *` preset — deletes. Two builds in a row lost
# them, and every consequence looked like a different bug: no Wi-Fi, no Steam
# sign-in, no cover art.
#
# A drop-in cannot be enabled or disabled. There is no symlink to remove, no
# [Install] section to consult and no preset that applies. It is either in the
# image or it is not, and the build asserts that it is.
[Unit]
Wants=NetworkManager.service
Wants=bluetooth.service
Wants=sshd.service
# The clock has to be right before any TLS handshake succeeds, and a wrong
# clock never announces itself — it shows up as "Steam won't sign in".
Wants=systemd-timesyncd.service
