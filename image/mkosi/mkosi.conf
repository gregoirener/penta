# PENTA OS image.
#
# Builds an Arch userspace into a bootable GPT disk image with systemd-boot.
# Runs on an x86_64 CI runner; see .github/workflows/image.yml.
#
# Only the ESP and root partition are in the image (~24 GiB). The data and swap
# partitions are created on first boot by systemd-repart against the real disk
# size — see mkosi.extra/usr/lib/repart.d/. That keeps the artifact small
# enough to stream to the SSD.

[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=disk
ImageId=penta
Output=penta
CompressOutput=zstd

[Content]
Bootable=yes
Bootloader=systemd-boot

# Silent, black boot. The last three are what stop a wall of systemd text from
# scrolling past the logo — a surprisingly large part of "console feel".
KernelCommandLine=
        quiet
        loglevel=3
        rd.udev.log_level=3
        vt.global_cursor_default=0
        splash
        nvidia_drm.modeset=1
        nvidia_drm.fbdev=1
        rootflags=subvol=@
        resume=LABEL=PENTA_SWAP

Packages=
        base
        linux
        linux-firmware
        systemd
        systemd-sysvcompat

        # Graphics: Ampere, so nvidia-open is the forward-looking choice.
        # Swap to `nvidia` if the open modules misbehave on this laptop.
        nvidia-open
        nvidia-utils
        lib32-nvidia-utils
        egl-wayland
        vulkan-icd-loader
        lib32-vulkan-icd-loader
        mesa
        lib32-mesa

        # Session
        gamescope
        greetd
        plymouth

        # Audio
        pipewire
        pipewire-pulse
        pipewire-alsa
        wireplumber

        # Input + Bluetooth
        bluez
        bluez-utils
        libinput

        # Daemon runtime
        python
        python-evdev
        python-dbus-next
        hidapi

        # Storage + net + dev loop
        btrfs-progs
        networkmanager
        openssh
        rsync

        # Diagnostics — worth the few MB the first time something is wrong
        # on a machine with no desktop to fall back to.
        vulkan-tools
        evtest
        pciutils
        usbutils
        strace

[Validation]
# Reproducible-ish builds: no build timestamp baked into the image.
SourceDateEpoch=0
