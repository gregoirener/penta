# PENTA OS image.
#
# Builds an Arch userspace into a bootable GPT disk image with systemd-boot.
# Runs on an x86_64 CI runner; see .github/workflows/image.yml.
#
# Only the ESP and root partition are in the image (~24 GiB). The data and swap
# partitions are created on first boot by systemd-repart against the real disk
# size — see mkosi.extra/usr/lib/repart.d/. That keeps the artifact small
# enough to stream to the SSD.

[Distribution]
Distribution=arch
Architecture=x86-64
# multilib is off by default in Arch and holds every lib32-* package plus
# Steam itself. Proton runs 32-bit game binaries, so this is not optional.
Repositories=multilib

[Output]
Format=disk
ImageId=penta
Output=penta

[Content]
Bootable=yes

# systemd-firstboot prompts interactively for anything left unset — locale,
# timezone, hostname, root password — and blocks the boot until someone answers
# on the keyboard. On a console that is a hang: nothing downstream starts and
# the screen sits on "Please configure the system!". Setting all of them here
# leaves it nothing to ask.
Hostname=penta
Locale=en_US.UTF-8
LocaleMessages=en_US.UTF-8
Keymap=us
Timezone=UTC

# Also means a boot that lands at a prompt can be answered rather than being a
# dead end. Change it once the thing works.
RootPassword=penta
Bootloader=systemd-boot

# Silent, black boot. The last three are what stop a wall of systemd text from
# scrolling past the logo — a surprisingly large part of "console feel".
KernelCommandLine=
        nvidia_drm.modeset=1
        nvidia_drm.fbdev=1
        console=tty0

Packages=
        base
        linux
        linux-firmware
        systemd
        systemd-sysvcompat

        # Graphics: Ampere, so nvidia-open is the forward-looking choice.
        # Swap to `nvidia` if the open modules misbehave on this laptop.
        nvidia-open
        nvidia-utils
        lib32-nvidia-utils
        egl-wayland
        vulkan-icd-loader
        lib32-vulkan-icd-loader
        mesa
        lib32-mesa

        # Session
        gamescope
        cage
        greetd
        plymouth

        # Content. Steam brings Proton, which is how Windows titles run.
        steam
        retroarch
        libretro
        ttf-dejavu

        # Audio
        pipewire
        pipewire-pulse
        pipewire-alsa
        wireplumber

        # Input + Bluetooth
        bluez
        bluez-utils
        libinput

        # Daemon runtime
        python
        python-evdev
        python-dbus-next
        hidapi

        # Storage + net + dev loop
        btrfs-progs
        networkmanager
        openssh
        rsync

        # Diagnostics — worth the few MB the first time something is wrong
        # on a machine with no desktop to fall back to.
        vulkan-tools
        evtest
        pciutils
        usbutils
        strace

# The initrd must be able to mount a btrfs root, or switch-root fails and the
# machine lands in emergency mode having found the disk but not been able to
# use it. Spelling these out is cheap insurance against mkosi's default set
# changing under us.
KernelModulesInitrdInclude=
        btrfs
        crc32c
        crc32c_generic
        libcrc32c
        xor
        raid6_pq
        zstd_compress
        nvme
        nvme_core
        usb_storage
        uas
        virtio_blk
        virtio_scsi
        virtio_pci
        sd_mod
        ahci

[Validation]
# Reproducible-ish builds: no build timestamp baked into the image.
SourceDateEpoch=0
