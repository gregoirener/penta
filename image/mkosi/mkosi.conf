# PENTA OS image.
#
# Builds an Arch userspace into a bootable GPT disk image with systemd-boot.
# Runs on an x86_64 CI runner; see .github/workflows/image.yml.
#
# Only the ESP and root partition are in the image (~24 GiB). The data and swap
# partitions are created on first boot by systemd-repart against the real disk
# size — see mkosi.extra/usr/lib/repart.d/. That keeps the artifact small
# enough to stream to the SSD.

[Distribution]
Distribution=arch
Architecture=x86-64
# multilib is off by default in Arch and holds every lib32-* package plus
# Steam itself. Proton runs 32-bit game binaries, so this is not optional.
Repositories=multilib

[Output]
Format=disk
ImageId=penta
Output=penta

[Content]
Bootable=yes

# systemd-firstboot prompts interactively for anything left unset — locale,
# timezone, hostname, root password — and blocks the boot until someone answers
# on the keyboard. On a console that is a hang: nothing downstream starts and
# the screen sits on "Please configure the system!". Setting all of them here
# leaves it nothing to ask.
Hostname=penta
Locale=en_US.UTF-8
LocaleMessages=en_US.UTF-8
Keymap=us
Timezone=UTC

# Also means a boot that lands at a prompt can be answered rather than being a
# dead end. Change it once the thing works.
RootPassword=penta
Bootloader=systemd-boot

# Two consoles, deliberately, and the order matters.
#
# Every console= listed receives kernel messages; the *last* one becomes
# /dev/console. So the panel is /dev/console (what a person sitting at the
# laptop sees), and the serial port still receives everything — which is the
# only channel CI, QEMU or a serial cable can read.
#
# This used to be `console=tty0` alone while /etc/systemd/system.conf.d/
# claimed otherwise, so QEMU's serial log was empty on every run and the boot
# check reported failure unconditionally. Nothing was ever verified.
#
# No `quiet` yet: while this is still being brought up on real hardware, a wall
# of kernel text beats a black screen. Add `quiet loglevel=3 splash` once it
# reliably reaches the menu.
KernelCommandLine=
        nvidia_drm.modeset=1
        nvidia_drm.fbdev=1
        console=ttyS0,115200
        console=tty0
        systemd.show_status=1
        rd.systemd.show_status=1

Packages=
        base
        linux
        linux-firmware
        systemd
        systemd-sysvcompat

        # Graphics: Ampere, so nvidia-open is the forward-looking choice.
        # Swap to `nvidia` if the open modules misbehave on this laptop.
        nvidia-open
        nvidia-utils
        lib32-nvidia-utils
        egl-wayland
        vulkan-icd-loader
        lib32-vulkan-icd-loader
        mesa
        lib32-mesa

        # Session
        gamescope
        cage
        greetd
        plymouth
        # gamescope runs X11 clients (which is most games, and Steam itself)
        # through Xwayland. Without it, `-e` and every non-Wayland title fail.
        xorg-xwayland

        # Content. Steam brings Proton, which is how Windows titles run.
        steam
        retroarch
        libretro
        ttf-dejavu

        # Audio
        pipewire
        pipewire-pulse
        pipewire-alsa
        wireplumber

        # Input + Bluetooth
        bluez
        bluez-utils
        libinput

        # Daemon runtime
        python
        python-evdev
        python-dbus-next
        hidapi

        # Storage + net + dev loop
        btrfs-progs
        networkmanager
        openssh
        rsync

        # The install-to-internal-disk path shells out to all three of these.
        # They were not in the image, so installing "succeeded" and then left a
        # disk with a corrupt GPT and no firmware boot entry:
        #   efibootmgr  — registers PENTA in NVRAM (installer.py)
        #   gptfdisk    — sgdisk -e, moves the backup GPT header after the clone
        #   xdg-utils   — xdg-open fallback for steam:// URLs (titles.py)
        efibootmgr
        gptfdisk
        xdg-utils

        # Diagnostics — worth the few MB the first time something is wrong
        # on a machine with no desktop to fall back to.
        vulkan-tools
        evtest
        pciutils
        usbutils
        strace

# NO KernelModulesInitrdInclude. The initrd carries every module.
#
# There used to be a hand-written list here — btrfs, nvme, usb_storage, ahci
# and a few others — described as "cheap insurance". It is the opposite of
# insurance: in mkosi, setting this option means the initrd contains ONLY the
# listed modules and their dependencies, so the list is not a floor, it is a
# ceiling. Every driver nobody thought of is excluded.
#
# What it excluded was `vmd`. Acer ships the Nitro 5 with Intel RST/VMD enabled,
# which puts the NVMe behind a controller that needs that module before any
# /dev/nvme* exists at all. The initrd found no disk, systemd-gpt-auto-root
# waited for a root partition that could never appear, timed out, and took five
# dependent units down with it into emergency mode — on a machine where the
# image had been written perfectly.
#
# docs/HARDWARE.md even records the RST/VMD trap, filed as "irrelevant here —
# PENTA never touches the internal disk". That stopped being true the day we
# built an installer whose whole purpose is writing to the internal disk.
#
# An unrestricted initrd costs a few hundred MB in a 2 GiB ESP. Guessing which
# storage controller a machine we cannot test has costs a boot.

[Validation]
# Reproducible-ish builds: no build timestamp baked into the image.
SourceDateEpoch=0
